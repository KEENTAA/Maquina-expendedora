server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Tipos MIME para Unity WebGL
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream data;
        application/javascript js;
        application/json json;
    }

    # Descompresión Gzip al vuelo y archivos precomprimidos .gz
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm application/octet-stream;

    # Soporte para archivos con compresión nativa .gz de Unity
    location ~* \.wasm\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/wasm;
        add_header Access-Control-Allow-Origin *;
    }

    location ~* \.data\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin *;
    }

    location ~* \.js\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/javascript;
        add_header Access-Control-Allow-Origin *;
    }

    location ~* \.symbols\.json\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }
}
